services:

  # ─────────────────────────────────────────────
  #  STOREFRONT FRONTEND (tradehubfront)
  #  Vite + TypeScript + Alpine.js
  # ─────────────────────────────────────────────
  storefront:
    build:
      context: ./tradehubfront
      dockerfile: Dockerfile
    container_name: tradehub-storefront
    ports:
      - "${STOREFRONT_PORT:-5173}:5173"
    volumes:
      - ./tradehubfront:/app
      - storefront_node_modules:/app/node_modules
    environment:
      - VITE_FRAPPE_BASE=http://frappe:8000
      - VITE_API_URL=
      - VITE_SELLER_PANEL_URL=http://localhost:${ADMIN_PORT:-8082}
    depends_on:
      frappe:
        condition: service_started
    networks:
      - tradehub
    restart: unless-stopped

  # ─────────────────────────────────────────────
  #  ADMIN PANEL FRONTEND (tr_tradehub/frontend)
  #  Vue 3 + Vite + Pinia
  # ─────────────────────────────────────────────
  admin:
    build:
      context: ./Frappe_Marketplace/frappe-bench/apps/tr_tradehub/frontend
      dockerfile: Dockerfile
    container_name: tradehub-admin
    ports:
      - "${ADMIN_PORT:-8082}:8082"
    volumes:
      - ./Frappe_Marketplace/frappe-bench/apps/tr_tradehub/frontend:/app
      - admin_node_modules:/app/node_modules
    environment:
      - VITE_FRAPPE_BACKEND=http://frappe:8000
      - VITE_FRAPPE_SOCKETIO=http://frappe:9000
    depends_on:
      frappe:
        condition: service_started
    networks:
      - tradehub
    restart: unless-stopped

  # ─────────────────────────────────────────────
  #  FRAPPE BACKEND
  #  Python 3.12 + Node 20 — bench serve
  # ─────────────────────────────────────────────
  frappe:
    build:
      context: ./Frappe_Marketplace
      dockerfile: Dockerfile
    container_name: tradehub-frappe
    ports:
      - "${FRAPPE_WEB_PORT:-8000}:8000"
      - "${FRAPPE_SOCKETIO_PORT:-9000}:9000"
    volumes:
      - ./Frappe_Marketplace/frappe-bench:/home/frappe/frappe-bench
    environment:
      - FRAPPE_SITE_NAME=${FRAPPE_SITE_NAME:-marketplace.local}
      - FRAPPE_ADMIN_PASSWORD=${FRAPPE_ADMIN_PASSWORD:-admin}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-frappe123}
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    networks:
      - tradehub
    restart: unless-stopped

  # ─────────────────────────────────────────────
  #  MariaDB
  # ─────────────────────────────────────────────
  mariadb:
    image: mariadb:10.11
    container_name: tradehub-mariadb
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-frappe123}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
      - --innodb-buffer-pool-size=256M
      - --innodb-log-file-size=64M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tradehub
    restart: unless-stopped

  # ─────────────────────────────────────────────
  #  Redis — Cache
  # ─────────────────────────────────────────────
  redis-cache:
    image: redis:7-alpine
    container_name: tradehub-redis-cache
    ports:
      - "${REDIS_CACHE_PORT:-13000}:6379"
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tradehub
    restart: unless-stopped

  # ─────────────────────────────────────────────
  #  Redis — Queue
  # ─────────────────────────────────────────────
  redis-queue:
    image: redis:7-alpine
    container_name: tradehub-redis-queue
    ports:
      - "${REDIS_QUEUE_PORT:-11000}:6379"
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tradehub
    restart: unless-stopped

# ─────────────────────────────────────────────
#  Volumes
# ─────────────────────────────────────────────
volumes:
  storefront_node_modules:
  admin_node_modules:
  mariadb_data:
  redis_cache_data:
  redis_queue_data:

# ─────────────────────────────────────────────
#  Network
# ─────────────────────────────────────────────
networks:
  tradehub:
    driver: bridge
